<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../print-design/"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20fill='%23111'/%3E%3Ctext%20x='12'%20y='46'%20fill='white'%20font-size='42'%20font-family='Arial'%3EM%3C/text%3E%3C/svg%3E"></head><body><a href="../print-design/">Gurian Vodka — Print Design</a><script>document.querySelectorAll('section ul').forEach(track=>{const section=track.closest('section');section.style.position='relative';const controls=document.createElement('div');controls.style.cssText='position:absolute;bottom:12px;right:12px;display:flex;gap:6px;z-index:10';[['←',-1,'Previous images'],['→',1,'Next images']].forEach(([label,direction,title])=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-label',title);b.style.cssText='width:40px;height:36px;border:1px solid #aaa;border-radius:4px;background:#111;color:white;font-size:20px;cursor:pointer';b.onclick=()=>track.scrollBy({left:direction*track.clientWidth*.8,behavior:'smooth'});controls.append(b)});section.append(controls)});</script></body></html>
