name: Import portfolio content
on:
  push:
    paths:
      - 'migration/**'
      - '.github/workflows/import-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-portfolio
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python migration/import_assets.py
      - name: Save the complete static website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Save static portfolio pages, images and fonts'
            git push
          fi
